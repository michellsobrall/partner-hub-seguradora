server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: partnerhub-backend

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:partnerhub_db}
    username: ${DB_USER:partnerhub_user}
    password: ${DB_PASSWORD:partnerhub_password}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      idle-timeout: 300000
      connection-timeout: 20000

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: ${JPA_SHOW_SQL:false}
    properties:
      hibernate:
        format_sql: ${JPA_FORMAT_SQL:false}
        dialect: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    enabled: ${FLYWAY_ENABLED:true}
    baseline-on-migrate: true
    locations: classpath:db/migration

  servlet:
    multipart:
      max-file-size: 15MB
      max-request-size: 30MB

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}
  security:
    jwt-secret: ${JWT_SECRET:supersecretpartnerhubtoken2026musthaveatleast256bitskeyhere}
    jwt-expiration-ms: ${JWT_EXPIRATION_MS:86400000}
  asaas:
    api-url: ${ASAAS_API_URL:https://sandbox.asaas.com/api/v3}
    api-key: ${ASAAS_API_KEY:}
