services:
  postgres:
    image: postgres:15-alpine
    container_name: partnerhub-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-partnerhub_db}
      POSTGRES_USER: ${DB_USER:-partnerhub_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-partnerhub_password}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-partnerhub_user} -d ${DB_NAME:-partnerhub_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: partnerhub-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@partnerhub.local}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin123}
    ports:
      - "${PGADMIN_PORT:-5050}:80"
    depends_on:
      postgres:
        condition: service_healthy

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: partnerhub-backend
    restart: unless-stopped
    ports:
      - "${SERVER_PORT:-8080}:8080"
    environment:
      SERVER_PORT: 8080
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-partnerhub_db}
      DB_USER: ${DB_USER:-partnerhub_user}
      DB_PASSWORD: ${DB_PASSWORD:-partnerhub_password}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173,http://localhost:3000}
      JPA_SHOW_SQL: ${JPA_SHOW_SQL:-true}
      FLYWAY_ENABLED: ${FLYWAY_ENABLED:-true}
      JWT_SECRET: ${JWT_SECRET:-supersecretpartnerhubtoken2026musthaveatleast256bitskeyhere}
      JWT_EXPIRATION_MS: ${JWT_EXPIRATION_MS:-86400000}
      ASAAS_API_URL: ${ASAAS_API_URL:-https://sandbox.asaas.com/api/v3}
      ASAAS_API_KEY: ${ASAAS_API_KEY:-}
      ASAAS_WEBHOOK_TOKEN: ${ASAAS_WEBHOOK_TOKEN:-whsec_partnerhub_asaas_2026}
      SENDGRID_API_KEY: ${SENDGRID_API_KEY:-}
      MAIL_HOST: ${MAIL_HOST:-cloud21.mailgrid.net.br}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_FROM: ${MAIL_FROM:-sender@forma.dev.br}
      NFSE_DEADLINE_DAY: ${NFSE_DEADLINE_DAY:-5}
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: partnerhub-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    environment:
      VITE_PORT: 5173
      VITE_API_BASE_URL: http://localhost:8080/api/v1
      VITE_API_PROXY_TARGET: http://backend:8080
      VITE_APP_ENV: docker-dev
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/index.html:/app/index.html
      - ./frontend/vite.config.ts:/app/vite.config.ts
    depends_on:
      - backend

volumes:
  postgres_data:
    driver: local
